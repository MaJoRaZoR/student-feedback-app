
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Feedback Portal</title>
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background: #eef2f8;
            margin: 0;
            padding: 30px 15px;
        }

        .container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 5px 25px #0001;
        }

        h1 {
            text-align: center;
            color: #183b73;
        }

        .subtitle {
            text-align: center;
            color: #666;
        }

        label {
            display: block;
            margin-top: 16px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        textarea { resize: vertical; }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 14px;
            background: #2456a6;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover { background: #173b78; }

        #message {
            text-align: center;
            color: green;
            margin-top: 20px;
            font-weight: bold;
        }

        footer {
            text-align: center;
            margin-top: 25px;
            color: #777;
            font-size: 13px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Student Feedback Portal</h1>
    <p class="subtitle">College Course Feedback System</p>

    <form id="feedbackForm">

        <label>Course Name</label>
        <input type="text" name="course" required
               placeholder="Enter course name">

        <label>Faculty Name</label>
        <input type="text" name="faculty" required
               placeholder="Enter faculty name">

        <label>Student Name</label>
        <input type="text" name="student" required
               value="Vidhanshu">

        <label>Register Number</label>
        <input type="text" name="register" required
               value="24MIS0483">

        <label>Department</label>
        <input type="text" name="department" required
               placeholder="Enter department">

        <label>Course Rating</label>
        <select name="rating" required>
            <option value="">Select rating</option>
            <option value="5">5 - Excellent</option>
            <option value="4">4 - Very Good</option>
            <option value="3">3 - Good</option>
            <option value="2">2 - Average</option>
            <option value="1">1 - Poor</option>
        </select>

        <label>Feedback / Comments</label>
        <textarea name="comments" rows="4" required
                  placeholder="Enter your feedback"></textarea>

        <button type="submit">Submit Feedback</button>
    </form>

    <p id="message" role="status"></p>

    <footer>
        Developed by Vidhanshu | 24MIS0483
    </footer>
</div>

<script>
document.getElementById("feedbackForm")
    .addEventListener("submit", function(event) {
        event.preventDefault();

        document.getElementById("message").textContent =
            "Feedback submitted successfully! Thank you.";

        this.reset();
    });
</script>

</body>
</html>
